<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
<head>
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">
        Checkout Demo
    </title>
    <meta charset="UTF-8"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>

    <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
            integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
            crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/application.css"/>

    <!-- Step 6 -->
    <!-- Add Adyen.Web Components/Drop-in stylesheet and embed script -->
    <!-- Adyen CSS from TEST environment (change to https://checkoutshopper-live.cdn... for production)-->
    <link rel="stylesheet"
          href="https://checkoutshopper-test.cdn.adyen.com/checkoutshopper/sdk/6.6.0/adyen.css"
          integrity="sha384-UAD/QSv1wQyfA60svLYxJ0OJAPl9TpkksO+HEOUX8YJcD+MYzNmn+q4XL7YBeHcr"
          crossorigin="anonymous">

    <!-- Adyen JS from TEST environment (change to https://checkoutshopper-live.cdn... for production)-->
    <script src="https://checkoutshopper-test.cdn.adyen.com/checkoutshopper/sdk/6.6.0/adyen.js"
            integrity="sha384-Oa2agnE48SFtDpzmEK8mbhbmEA1X4WH6afLBbypUhFU8oDhJWAIGvLQTBrqgls4A"
            crossorigin="anonymous"></script>

</head>
<body>
<header id="header">
    <a href="/">
        <img src="/images/mystore-logo.svg" alt=""/>
    </a>
</header>
<div class="container">
    <th:block layout:fragment="content"/>
</div>

<script>
    // Step 6: Initialize Adyen Drop-in
    const configuration = {
        environment: 'test', // Adyen TEST environment
        clientKey: 'YOUR_ADYEN_CLIENT_KEY', // Replace with your actual client key
        paymentMethodsResponse: {
            merchantAccount: "ADYEN_MERCHANT_ACCOUNT", // Replace with your merchant account
            shopperReference: "your-shopper-reference-123",
            storedPaymentMethods: [
                {
                    brand: "upi_intent",
                    id: "Z58FGTKBRCQ2WN27",
                    mandate: {
                        amount: "7005",
                        amountRule: "max",
                        billingAttemptsRule: "on",
                        billingDay: "24",
                        currency: "INR",
                        endsAt: "2026-08-09",
                        frequency: "adhoc",
                        mandateId: "123abc-abc123...",
                        providerId: "123abc-abc123...",
                        remarks: "mandate name/remarks",
                        startsAt: "2024-08-07",
                        status: "active",
                        txVariant: "upi_intent"
                    },
                    supportedRecurringProcessingModels: [
                        "CardOnFile",
                        "Subscription",
                        "UnscheduledCardOnFile"
                    ],
                    type: "upi"
                }
            ]
        }
    };

    const checkout = new AdyenCheckout(configuration);
    checkout.create('dropin').mount('#dropin-container');
</script>
<div id="dropin-container"></div>
</body>
</html>
